name: "3 · Build"

# Boucle DevOps — étape BUILD (validation des images, sans push).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: "build: docker (${{ matrix.name }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/api/Dockerfile
          - name: frontend
            dockerfile: crypto-dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (validation Dockerfile, sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          tags: cryptoviz-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
