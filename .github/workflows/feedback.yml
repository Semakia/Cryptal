name: "7 · Feedback"

# Boucle DevOps — étape FEEDBACK.
# Ouvre automatiquement une issue d'incident quand le déploiement ou le
# monitoring échoue, pour reboucler vers l'étape PLAN.
on:
  workflow_run:
    workflows: ["5 · Deploy", "6 · Monitor"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  incident-issue:
    name: "feedback: incident-issue"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Ouvrir une issue d'incident
        uses: actions/github-script@v7
        with:
          script: |
            const wr = context.payload.workflow_run;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Échec « ${wr.name} » — run #${wr.run_number}`,
              body: [
                `L'étape **${wr.name}** a échoué (conclusion: \`${wr.conclusion}\`).`,
                ``,
                `Run : ${wr.html_url}`,
                `Branche : \`${wr.head_branch}\``,
                `Commit : \`${wr.head_sha}\``,
              ].join("\n"),
              labels: ["incident", "deploy"],
            });
