name: Security

# Volet DevSecOps : SAST, scan des dépendances, scan de secrets, scan d'images.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # re-scan hebdomadaire (lundi 06:00 UTC)

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST (bandit + semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "bandit==1.8.0" "semgrep==1.97.0"
      - name: Bandit — bloque sur sévérité HIGH
        run: bandit -r src -lll -x src/test,src/jars
      - name: Semgrep — règles auto (rapport seulement)
        run: semgrep scan --config auto --error src
        continue-on-error: true

  dependencies:
    name: Scan des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (Python)
        run: |
          pip install pip-audit
          pip-audit -r src/api/requirements.txt
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pnpm audit (frontend)
        working-directory: crypto-dashboard
        run: |
          corepack enable && corepack prepare pnpm@10 --activate
          pnpm audit --audit-level high
        continue-on-error: true

  secrets:
    name: Scan de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scanne tout l'historique
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Build + scan image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/api/Dockerfile
          - name: frontend
            dockerfile: crypto-dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: cryptoviz-${{ matrix.name }}:ci
      - name: Trivy — bloque sur CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cryptoviz-${{ matrix.name }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
