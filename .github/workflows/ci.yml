name: CI

# Boucle DevOps — étapes CODE, TEST, BUILD.
# Déclenché sur chaque push de branche et chaque PR vers main.
# (PLAN = issues/PR templates · SECURE = security.yml · RELEASE/DEPLOY/MONITOR = release.yml + deploy.yml)
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────── CODE ───────────────────────────────
  code-quality:
    name: "[CODE] Qualité (marqueurs conflit + ruff + eslint)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Échouer si des marqueurs de merge subsistent
        run: |
          if grep -rnE '^(<<<<<<<|>>>>>>>)' \
              --include='*.py' --include='*.ts' --include='*.tsx' \
              --include='*.js' --include='*.jsx' --include='*.yml' \
              --include='*.yaml' --include='*.json' \
              --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::Marqueurs de conflit de merge détectés"
            exit 1
          fi
          echo "OK : aucun marqueur de conflit"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff==0.8.4"
      - name: Ruff — erreurs réelles (bloquant)
        run: ruff check --select E9,F63,F7,F82 src
      - name: Ruff — style complet (rapport seulement)
        run: ruff check src
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Activer pnpm 10
        run: corepack enable && corepack prepare pnpm@10 --activate
      - name: Installer les dépendances front
        working-directory: crypto-dashboard
        run: pnpm install --frozen-lockfile
      - name: ESLint (rapport seulement)
        working-directory: crypto-dashboard
        run: pnpm lint
        continue-on-error: true

  # ─────────────────────────────── TEST ───────────────────────────────
  test:
    name: "[TEST] Tests Python (pytest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances API + pytest
        run: |
          pip install -r src/api/requirements.txt
          pip install pytest
      - name: Lancer pytest (tolère l'absence de tests)
        run: |
          set +e
          pytest -q src/test
          code=$?
          # exit 5 = aucun test collecté -> on ne bloque pas (à compléter)
          if [ "$code" -eq 5 ]; then
            echo "::warning::Aucun test collecté — pense à ajouter des tests dans src/test"
            exit 0
          fi
          exit $code

  # ─────────────────────────────── BUILD ──────────────────────────────
  build:
    name: "[BUILD] Build images Docker (${{ matrix.name }})"
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/api/Dockerfile
          - name: frontend
            dockerfile: crypto-dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (validation Dockerfile, sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          tags: cryptoviz-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
