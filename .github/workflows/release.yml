name: Release

# Boucle DevOps — étape RELEASE.
# Construit les images de production et les publie sur GHCR (registre GitHub),
# puis crée une GitHub Release lorsqu'un tag `v*` est poussé.
#   - push sur main      -> images taguées `latest` + `sha-<court>`
#   - tag `v1.2.3`       -> images taguées `1.2.3`, `1.2`, `latest` + GitHub Release
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write # créer la GitHub Release
  packages: write # pousser les images sur GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────── RELEASE (images) ───────────────────────
  images:
    name: "[RELEASE] Publier image (${{ matrix.name }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/api/Dockerfile
          - name: frontend
            dockerfile: crypto-dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées & tags d'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push vers GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────── RELEASE (notes) ────────────────────────
  github-release:
    name: "[RELEASE] Créer la GitHub Release"
    runs-on: ubuntu-latest
    needs: [images]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publier la release (notes auto-générées)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Images publiées sur GHCR :
            - `ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}`
