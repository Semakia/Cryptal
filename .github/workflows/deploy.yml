name: Deploy

# Boucle DevOps — étapes DEPLOY, MONITOR, FEEDBACK.
# Déploie les images publiées sur GHCR vers le serveur, vérifie la santé du
# service (monitor), puis remonte l'info en cas d'échec (feedback).
#
# OPT-IN : le job de déploiement ne s'exécute que si la variable de dépôt
# `DEPLOY_ENABLED` vaut "true" (Settings → Secrets and variables → Actions →
# Variables). Tant qu'elle n'est pas définie, le workflow reste neutre.
#
# Secrets attendus (Environment `production`) :
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY   → accès SSH au serveur
# Variables attendues :
#   APP_API_URL        → ex: https://api.exemple.com  (pour le health check)
#   APP_FRONTEND_URL   → ex: https://exemple.com
on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read
  packages: read
  issues: write # feedback : ouvrir une issue en cas d'échec

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─────────────────────────────── DEPLOY ─────────────────────────────
  deploy:
    name: "[DEPLOY] Serveur (production)"
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment:
      name: production
      url: ${{ vars.APP_FRONTEND_URL }}
    steps:
      - name: Déploiement via SSH (pull GHCR + compose up)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ${{ vars.DEPLOY_PATH || '~/cryptoviz' }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

  # ─────────────────────────────── MONITOR ────────────────────────────
  monitor:
    name: "[MONITOR] Health checks post-déploiement"
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Vérifier l'API (/health)
        run: |
          url="${{ vars.APP_API_URL }}"
          if [ -z "$url" ]; then
            echo "::warning::APP_API_URL non défini — health check API ignoré"
            exit 0
          fi
          for i in $(seq 1 5); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url/health" || echo 000)
            echo "Tentative $i : HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::API non saine après 5 tentatives"
          exit 1
      - name: Vérifier le frontend
        run: |
          url="${{ vars.APP_FRONTEND_URL }}"
          if [ -z "$url" ]; then
            echo "::warning::APP_FRONTEND_URL non défini — health check front ignoré"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo 000)
          echo "Frontend : HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Frontend injoignable"; exit 1; }

  # ─────────────────────────────── FEEDBACK ───────────────────────────
  feedback:
    name: "[FEEDBACK] Alerte en cas d'échec"
    runs-on: ubuntu-latest
    needs: [deploy, monitor]
    if: failure()
    steps:
      - name: Ouvrir une issue d'incident
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Échec de déploiement — run #${context.runId}`,
              body: `Le déploiement ou le monitoring a échoué.\n\nRun : ${run}\nRef : \`${context.ref}\`\nCommit : \`${context.sha}\``,
              labels: ["incident", "deploy"],
            });
