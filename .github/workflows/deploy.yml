name: "5 · Deploy"

# Boucle DevOps — étape DEPLOY.
# Déploie les images publiées sur GHCR vers le serveur (pull + compose up).
#
# OPT-IN : ne s'exécute que si la variable de dépôt `DEPLOY_ENABLED` vaut "true"
# (Settings → Secrets and variables → Actions → Variables). Sinon le job est
# ignoré et le workflow reste neutre.
#
# Secrets (Environment `production`) : DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
# Variables : DEPLOY_PATH, APP_FRONTEND_URL
on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: "deploy: server"
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment:
      name: production
      url: ${{ vars.APP_FRONTEND_URL }}
    steps:
      - name: Déploiement via SSH (pull GHCR + compose up)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Secrets passés par variables d'environnement plutôt qu'interpolés
          # dans le script (évite toute fuite dans les logs).
          envs: GHCR_TOKEN,GHCR_USER,COMPOSE
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd ${{ vars.DEPLOY_PATH || '~/cryptoviz' }}
            # Récupère les éventuels changements de compose / Caddyfile
            git pull --ff-only
            docker compose -f "$COMPOSE" pull
            docker compose -f "$COMPOSE" up -d --remove-orphans
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          COMPOSE: .config/iac/prod/docker-compose.yml
