services:
  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:9092,PLAINTEXT_EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: "market_data:3:1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper
    restart: unless-stopped
  
 

  # producer service to send messages to Kafka
  kafka-producer:
    build:
      context: ../../../../
      dockerfile: .config/iac/dev/kafka/producer/Dockerfile
    container_name: kafka-producer
    environment:
      KAFKA_BROKER: kafka:9092
      TOPIC_NAME: market_data
    depends_on:
      - kafka
    restart: unless-stopped

  # consumer service to read messages from Kafka
  kafka-consumer:
    build:
      context: ../../../../
      dockerfile: .config/iac/dev/kafka/consumer/Dockerfile
    container_name: kafka-consumer
    env_file:
      - ../../../../src/.env
    environment:
      KAFKA_BROKER: kafka:9092
      TOPIC_NAME: market_data
    depends_on:
      - kafka
    restart: unless-stopped
