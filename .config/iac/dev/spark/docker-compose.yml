version: "3.8"

services:
  master:
    image: docker.io/bitnami/spark:3.5
    container_name: spark-master
    hostname: master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
      - SPARK_MODE=master
      - HOME=/tmp
      - HADOOP_USER_NAME=spark
      - SPARK_LOCAL_DIRS=/tmp/spark-local
      - SPARK_LOG_CONF=/opt/bitnami/spark/conf/log4j2.properties
      - PYTHONPATH=/opt/spark/scripts
      - BRONZE_DB_HOST=${BRONZE_DB_HOST}
      - BRONZE_DB_NAME=${BRONZE_DB_NAME}
      - BRONZE_DB_PORT=${BRONZE_DB_PORT}
      - BRONZE_DB_USER=${BRONZE_DB_USER}
      - BRONZE_DB_PASSWORD=${BRONZE_DB_PASSWORD}
      - SILVER_DB_HOST=${SILVER_DB_HOST}
      - SILVER_DB_NAME=${SILVER_DB_NAME}
      - SILVER_DB_PORT=${SILVER_DB_PORT}
      - SILVER_DB_USER=${SILVER_DB_USER}
      - SILVER_DB_PASSWORD=${SILVER_DB_PASSWORD}
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ../../../../src/:/opt/spark/scripts
      - ./data:/opt/spark/data
      - ./ivy:/tmp/.ivy2

  worker1:
    image: docker.io/bitnami/spark:3.5
    container_name: spark-worker-1
    hostname: worker1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
      - SPARK_LOG_CONF=/opt/bitnami/spark/conf/log4j2.properties
    volumes:
      - ./scripts:/opt/spark/scripts
      - ./data:/opt/spark/data
    depends_on:
      - master

  worker2:
    image: docker.io/bitnami/spark:3.5
    container_name: spark-worker-2
    hostname: worker2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
      - HADOOP_USER_NAME=spark
      - SPARK_LOG_CONF=/opt/bitnami/spark/conf/log4j2.properties
    volumes:
      - ./scripts:/opt/spark/scripts
      - ./data:/opt/spark/data
    depends_on:
      - master
