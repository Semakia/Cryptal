services:
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "8082:80"
    restart: always
    volumes:
      - pgadmin-volume:/var/lib/pgadmin

volumes:
  pgadmin-volume:
    name: crypto-viz-pgadmin