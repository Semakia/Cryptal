# Stack de production (VPS) — API FastAPI seule.
# Le frontend est sur Vercel. Le HTTPS est assuré par le Caddy DÉJÀ présent sur
# le VPS (projet « homepedia »), qui possède les ports 80/443 : on ne lance donc
# PAS de second reverse proxy. Notre API rejoint le réseau de ce Caddy, et un
# bloc de site est ajouté à SON Caddyfile pour proxy vers cryptoviz-api:8000.
# (cf. .config/iac/prod/README.md)
#
# Prérequis sur le serveur, dans ce dossier (.config/iac/prod) :
#   - un fichier .env.prod (NON versionné) : identifiants BDD + CORS_ORIGINS
#       CORS_ORIGINS=https://t-data-901-crypto.vercel.app
#
# Déploiement (fait par le job "5 · Deploy") :
#   docker compose -f .config/iac/prod/docker-compose.yml pull
#   docker compose -f .config/iac/prod/docker-compose.yml up -d

name: cryptoviz-prod

services:
  api:
    image: ghcr.io/semakia/t-data-901-crypto_viz/api:latest
    container_name: cryptoviz-api
    restart: unless-stopped
    env_file:
      - .env.prod
    expose:
      - "8000" # atteint par le Caddy de homepedia via le réseau partagé
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - proxy

networks:
  # Réseau du Caddy existant (projet homepedia). Externe : déjà créé sur le VPS.
  proxy:
    external: true
    name: homepedia-prod_default
